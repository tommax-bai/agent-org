# Phase 0C 基础设施(docker-compose)
#
# 起两个服务:
#   - postgres   : tasks / task_events / artifacts 存储 + Langfuse 自己用
#   - langfuse   : LLM observability(self-hosted)
#
# 启动:
#   cp .env.example .env  # 改密码 + Langfuse secrets
#   docker compose up -d
#
# Postgres 监听 127.0.0.1:5432(只本机);Langfuse Web UI 监听 127.0.0.1:3000

services:
  postgres:
    image: postgres:16-alpine
    container_name: agent-org-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: agent_org
      POSTGRES_USER: ${POSTGRES_USER:-agent}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-agent} -d agent_org"]
      interval: 10s
      timeout: 5s
      retries: 5

  langfuse:
    image: langfuse/langfuse:2
    container_name: agent-org-langfuse
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: "postgresql://${POSTGRES_USER:-agent}:${POSTGRES_PASSWORD}@postgres:5432/langfuse"
      NEXTAUTH_URL: "http://localhost:3000"
      NEXTAUTH_SECRET: ${LANGFUSE_NEXTAUTH_SECRET:?LANGFUSE_NEXTAUTH_SECRET must be set in .env}
      SALT: ${LANGFUSE_SALT:?LANGFUSE_SALT must be set in .env}
      TELEMETRY_ENABLED: "false"
      LANGFUSE_DEFAULT_PROJECT_ROLE: "ADMIN"
    ports:
      - "127.0.0.1:3000:3000"

volumes:
  postgres_data:
    name: agent-org-postgres-data
