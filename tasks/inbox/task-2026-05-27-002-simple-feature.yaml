task_id: task-2026-05-27-002
title: Add health check endpoint
project_id: example-api
priority: normal

owner_request: |
  加一个 /health 接口,GET 请求返回 JSON,包含:
    - status: ok | degraded
    - version: 当前服务版本(从 package.json 读)
    - db_connection: 数据库是否能连
    - uptime_seconds: 服务启动多久

  方便监控系统调用。

constraints:
  - 不需要认证(monitoring 直接访问)
  - 不允许引入新依赖

success_criteria:
  - GET /health 返回符合上述格式的 JSON
  - 数据库不通时 status=degraded 但 HTTP 200
  - 单元测试覆盖正常和数据库不通两种场景

budget_usd: 10.0
