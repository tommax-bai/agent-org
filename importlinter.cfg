[importlinter]
root_package = orchestrator
include_external_packages = True

# 规则:每个模块不能访问其他模块的 _internal(v2.3 最重要的规则)
#
# 用法:每个 module 用一个 contract,source = 该 module,forbidden = 其他所有 module 的 _internal
# 这样写比 source 含全部 modules 更明确,且符合 import-linter 的"source 不能含 forbidden 祖先"的约束
#
# Phase 0A 骨架阶段所有模块为空,规则成立。Phase 0B 写代码时持续 enforce。

[importlinter:contract:no_cross_internal_from_state_machine]
name = state_machine cannot access other modules' _internal
type = forbidden
source_modules = orchestrator.state_machine
forbidden_modules =
    orchestrator.dispatcher._internal
    orchestrator.roles._internal
    orchestrator.llm._internal
    orchestrator.memory._internal
    orchestrator.event_log._internal
    orchestrator.artifact._internal
    orchestrator.budget._internal
    orchestrator.escalation._internal
allow_indirect_imports = false

