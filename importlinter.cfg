# Phase 0A 不强制 layered architecture(模块还没代码),Phase 0B 起再加这个 contract
# 已否决方案:用 forbidden 反向陈述"下层不能 import 上层"——会爆炸成几十个 contract,
# 等真有代码再用 import-linter 的 layers contract(那时模块路径就稳定了,shared descendants
# 问题应该不存在)
