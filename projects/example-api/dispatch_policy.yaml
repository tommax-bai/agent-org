# v2.2 新增,v2.4 沿用
# Phase 0A 用最小规则集,Phase 1 跑数据后再补 mandatory_role_rules

mandatory_role_rules: []   # example-api 暂不强制(简化 Phase 0A)

# 真实项目里通常这样配:
#   - id: security_sensitive_task
#     if_any:
#       task_contains: [OAuth, token, password, auth, login, JWT]
#     require_roles: [security_reviewer]
#   - id: data_loss_risk
#     if_any:
#       task_contains: [migration, drop table, schema change]
#     require_roles: [reviewer]
#     require_approval_gate: true

pm_deviation_policy:
  can_add_roles: true
  can_remove_template_roles: true
  cannot_remove_mandatory_roles: true
  removing_template_role_requires_signal: true
  adding_non_template_role_requires_dispatch_note: true

exceptions: []

# v2.4 retry 上限
retry_limits:
  pm_validator_retry_max: 1   # PM dispatch_plan validator 上限
  role_attempt_max: 2         # 同 (subtask, role) attempt 上限
