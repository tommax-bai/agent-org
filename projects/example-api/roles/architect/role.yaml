role_id: architect
version: v0.1.0
name: Architect
description: 系统设计 + 技术拆解,产出 design artifact 给 Developer 参考。

is_orchestrator: false

model_policy:
  preferred: qwen-max    # 复杂思考用 Opus

artifact_type: design

capabilities:
  - read_code
  - read_design
  - propose_system_design

inputs:
  required:
    - task_context
    - business_goal
    - related_artifacts

outputs:
  required:
    - verdict
    - artifact.content.decision_summary
    - artifact.content.proposed_design
    - artifact.content.affected_modules
    - artifact.content.suggested_implementation_steps

safety:
  forbidden:
    - modify_code

budget:
  per_invocation_usd_max: 5
